# Which Antigravity model does which job in the loop (D95).
#
#   role = pattern | pattern | ...
#
# scripts/agy-run.sh reads this file. For a role it takes the FIRST pattern that
# matches a line of `agy models` (case-insensitive regular expression, matched
# against "id<TAB>label"). A model your plan does not have, or that is locked, is
# not in that list, so the next pattern is used. When a model fails during a run
# (usage limit reached, error), the next one in the row is tried — that is the
# "use Opus 5.5 until its limit ends, then Gemini" rule.
#
# See what each role resolves to right now:   scripts/agy-run.sh models

# The session that runs /loop-night and plans the work. In Claude Code this was
# Fable's job. Orchestrator (Neon) = Gemini 4 Neon plans and reviews progress,
# Gemini 4 Hydrogen does the edits.
lead = orchestrator.*neon | gemini-4-neon-high | gemini-4-neon | orchestrator.*argon | gemini-4-argon | claude-opus-4-6 | gemini-3\.8-flash-high

# Answers a question a task raised (loop-decide). Fable's job in Claude Code.
decide = gemini-4-neon-high | gemini-4-neon | gemini-4-argon | claude-opus-4-6 | gemini-3\.8-flash-high

# Review of high-risk or security work, and of a high-risk brief (loop-verify).
# Opus 5.5 first; Gemini 4 Neon when the Opus limit is used up.
review-high = opus[ -]5[.-]5 | gemini-4-neon-high | gemini-4-neon | gemini-4-argon | claude-opus-4-6 | gemini-3\.8-flash-high

# One whole task per fresh session (scripts/agy-night.sh only).
task = orchestrator.*neon | orchestrator.*argon | gemini-4-neon | gemini-4-argon | gemini-4-hydrogen | gemini-3\.8-flash-high
