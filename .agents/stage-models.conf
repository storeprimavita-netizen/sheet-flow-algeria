# Which program and model does which job in the night runner (D101).
# Read by scripts/stage.sh, used by scripts/night.sh.
#
#   role = cli:model:effort | cli:model:effort | ...
#
# cli is codex, agy (Antigravity CLI) or claude. The first entry whose program is
# installed and not at its usage limit is used; when a session fails or hits the
# limit, the next entry is tried. A program that is not installed is skipped, so
# the agy entries cost nothing until `agy` is installed and signed in.
#   - codex model: an id from `codex debug models`
#   - agy model:   a pattern matched against the lines of `agy models`; the id already carries the
#                  thinking level (gemini-4-hydrogen-high), so no effort is written. An entry whose
#                  model the account does not offer is skipped (Gemini 4 Neon is listed first for the
#                  day the plan includes it). Antigravity also serves Claude Opus 4.6 on Google's quota.
#   - claude model: sonnet | haiku | opus
# effort is the thinking level (low | medium | high); leave it out for the default.
# Three programs at once (scripts/night-workers.sh): each run has a lead program
# (STAGE_PREFER). The lead's entries are tried first for briefs, builds and ships and
# last for reviews, so what one program builds another one reviews.
# See what each role resolves to right now:   scripts/stage.sh models
#
# Why these choices (Codex prices per million tokens, input/output, in credits:
# Luna 2.5/12.5 · Sol 50/250 · Astra 200/1000): Luna where the work is mechanical,
# Sol where code is written, Astra only for short reading jobs that need judgement.
# Claude is last everywhere except the security review.

# Choose the next task and write its brief. Reading-heavy; the brief decides the quality of everything after it.
brief = codex:gpt-6.2-sol:medium | agy:gemini-4-neon-high | agy:gemini-4-hydrogen-high | claude:sonnet

# Build a task whose brief says risk high (database, money, permissions, public endpoints).
build-high = codex:gpt-6.2-sol:high | agy:gemini-4-neon-high | agy:gemini-4-hydrogen-xhigh | claude:sonnet

# Build a task whose brief says risk low.
build = codex:gpt-6.2-sol:medium | agy:gemini-4-neon-high | agy:gemini-4-hydrogen-high | claude:sonnet

# Build a small follow-up row (risk low, no migration). Cheapest model first; a failed gate moves to the next entry.
build-small = codex:gpt-6-luna:medium | codex:gpt-6.2-sol:medium | agy:gemini-4-hydrogen-medium | claude:haiku

# Review a screen in the browser (surface ui, risk low).
review-ui = codex:gpt-6.1-terra:medium | agy:gemini-4-neon-high | agy:gemini-4-hydrogen-high | claude:sonnet

# Review high-risk work that is not a security surface.
review-high = codex:gpt-6.2-astra:high | agy:claude-opus-4-6 | claude:opus | agy:gemini-4-hydrogen-xhigh

# Review a security surface (public endpoint, webhook, tokens, permissions): a model from
# another company than the builder first. Put the codex entry first to use Claude less.
review-sec = claude:opus | agy:claude-opus-4-6 | codex:gpt-6.2-astra:high | agy:gemini-4-hydrogen-xhigh

# Answer a question a task raised, or log it for the owner. Claude Fable first (owner, 2026-11-24, D104).
decide = claude:claude-fable-5-2 | codex:gpt-6.2-astra:high | agy:claude-opus-4-6

# Final gate, progress note, merge into v3. Mechanical.
ship = codex:gpt-6-luna:low | codex:gpt-6.2-sol:low | agy:gemini-4-hydrogen-low | claude:haiku
